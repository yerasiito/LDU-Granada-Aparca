<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" style="background:#F6F8FB; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <style>
      .title { font-size: 20px; font-weight: 800; fill: #202C3A; }
      .subtitle { font-size: 13px; fill: #5A6E82; font-weight: 500; }
      .box-title { font-size: 14px; font-weight: 700; fill: #202C3A; }
      .box-desc { font-size: 11px; fill: #5A6E82; }
      .badge-text { font-size: 11px; font-weight: 700; fill: white; }
      .pill-text { font-size: 11px; font-weight: 600; }
      .arrow { stroke: #8FA2B5; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-dashed { stroke: #1769C2; stroke-width: 2; stroke-dasharray: 4,4; fill: none; marker-end: url(#arrowhead-blue); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8FA2B5" />
    </marker>
    <marker id="arrowhead-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1769C2" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Encabezado -->
  <text x="40" y="45" class="title">🚗 Granada Aparca — Flujo del Motor de Previsión y Decisión</text>
  <text x="40" y="68" class="subtitle">Arquitectura de cálculo basada en aforos en tiempo real y reglas de optimización de tiempo (Reto #07)</text>

  <!-- 1. ENTRADA DE DATOS -->
  <g transform="translate(40, 95)" filter="url(#shadow)">
    <rect width="260" height="230" rx="12" fill="#FFFFFF" stroke="#DFE5EB"/>
    <rect width="260" height="34" rx="12" fill="#202C3A"/>
    <rect y="20" width="260" height="14" fill="#202C3A"/>
    <text x="16" y="22" font-size="12" font-weight="700" fill="#FFFFFF">1. ENTRADAS AL SISTEMA</text>

    <!-- Subcajas -->
    <rect x="14" y="46" width="232" height="48" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="24" y="64" class="box-title" font-size="12">👤 Usuario (Yeray)</text>
    <text x="24" y="82" class="box-desc">Destino: Ayto. | Llegada: 15:00 | Máx pie: 10 min</text>

    <rect x="14" y="104" width="232" height="48" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="24" y="122" class="box-title" font-size="12">📡 Aforos Oficiales (CGIM)</text>
    <text x="24" y="140" class="box-desc">Plazas libres en vivo cada 5 min (24 parkings)</text>

    <rect x="14" y="162" width="232" height="54" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="24" y="180" class="box-title" font-size="12">🗺️ Matriz de Movilidad</text>
    <text x="24" y="196" class="box-desc">Tiempo coche (ETSIIT ➔ Parking: 11-14m)</text>
    <text x="24" y="208" class="box-desc">Tiempo a pie (Parking ➔ Ayto: 2-15m)</text>
  </g>

  <!-- Flecha 1 -> 2 -->
  <path d="M 300 210 L 350 210" class="arrow"/>

  <!-- 2. FILTRADO Y VALIDACIÓN -->
  <g transform="translate(360, 95)" filter="url(#shadow)">
    <rect width="260" height="230" rx="12" fill="#FFFFFF" stroke="#DFE5EB"/>
    <rect width="260" height="34" rx="12" fill="#1769C2"/>
    <rect y="20" width="260" height="14" fill="#1769C2"/>
    <text x="16" y="22" font-size="12" font-weight="700" fill="#FFFFFF">2. FILTROS Y VALIDACIÓN</text>

    <rect x="14" y="46" width="232" height="52" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="24" y="64" class="box-title" font-size="12">Filtro de Caminata Máxima</text>
    <text x="24" y="80" class="box-desc">¿Tiempo a pie ≤ Preferencia (10 min)?</text>
    <text x="24" y="91" class="box-desc" fill="#B33B32" font-weight="600">Descarta: Sócrates (12m), Alsina (15m)</text>

    <rect x="14" y="108" width="232" height="52" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="24" y="126" class="box-title" font-size="12">Validación de Integridad</text>
    <text x="24" y="142" class="box-desc">Capacidad física &gt; 0 | Frescura de lectura</text>
    <text x="24" y="153" class="box-desc">&gt;10 min sin datos ➔ "Desactualizado"</text>

    <rect x="14" y="170" width="232" height="46" rx="8" fill="#EFF5FF" stroke="#BFDBFE"/>
    <text x="24" y="188" class="box-title" font-size="12" fill="#1769C2">Candidatos Válidos</text>
    <text x="24" y="204" class="box-desc" fill="#1E40AF">Rex, Puerta Real, Ganivet, S. Agustín, Escolapios</text>
  </g>

  <!-- Flecha 2 -> 3 -->
  <path d="M 620 210 L 670 210" class="arrow"/>

  <!-- 3. MOTOR DE PREDICCIÓN (+15m / Horaria) -->
  <g transform="translate(680, 95)" filter="url(#shadow)">
    <rect width="280" height="230" rx="12" fill="#FFFFFF" stroke="#DFE5EB"/>
    <rect width="280" height="34" rx="12" fill="#202C3A"/>
    <rect y="20" width="280" height="14" fill="#202C3A"/>
    <text x="16" y="22" font-size="12" font-weight="700" fill="#FFFFFF">3. MOTOR DE PREDICCIÓN</text>

    <!-- Fórmula -->
    <rect x="14" y="46" width="252" height="54" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="24" y="64" class="box-title" font-size="11">Fórmula de Ocupación Futura</text>
    <text x="24" y="80" font-size="11" font-weight="700" fill="#1769C2">O_prev = limitar(O_act + Δ, 0, Capacidad)</text>
    <text x="24" y="93" class="box-desc">Libres_prev = Capacidad − O_prev</text>

    <!-- Semáforo de Niveles -->
    <text x="14" y="118" class="box-title" font-size="11">Clasificación y Penalización:</text>

    <rect x="14" y="126" width="252" height="26" rx="6" fill="#D7E9DD"/>
    <text x="22" y="143" font-size="10" font-weight="700" fill="#14532D">🟢 VERDE (&lt; 70%)</text>
    <text x="160" y="143" font-size="10" font-weight="700" fill="#14532D">Penalización: +0 min</text>

    <rect x="14" y="156" width="252" height="26" rx="6" fill="#FBEBDE"/>
    <text x="22" y="173" font-size="10" font-weight="700" fill="#93500D">🟡 ÁMBAR (70% – 89%)</text>
    <text x="160" y="173" font-size="10" font-weight="700" fill="#93500D">Penalización: +5 min</text>

    <rect x="14" y="186" width="252" height="26" rx="6" fill="#FCECE9"/>
    <text x="22" y="203" font-size="10" font-weight="700" fill="#B33B32">🔴 ROJO (≥ 90%)</text>
    <text x="160" y="203" font-size="10" font-weight="700" fill="#B33B32">Penalización: +10 min</text>
  </g>

  <!-- Flecha hacia abajo desde Motor a Puntuación -->
  <path d="M 820 325 L 820 365 L 500 365 L 500 395" class="arrow"/>

  <!-- 4. PUNTUACIÓN Y DESEMPATE -->
  <g transform="translate(180, 400)" filter="url(#shadow)">
    <rect width="640" height="110" rx="12" fill="#FFFFFF" stroke="#DFE5EB"/>
    <rect width="640" height="30" rx="12" fill="#1769C2"/>
    <rect y="16" width="640" height="14" fill="#1769C2"/>
    <text x="16" y="20" font-size="12" font-weight="700" fill="#FFFFFF">4. PUNTUACIÓN DE DECISIÓN Y CRITERIO DE DESEMPATE</text>

    <text x="24" y="52" font-size="13" font-weight="800" fill="#202C3A">
      Función de Coste: Puntuación = Minutos Conducción + Minutos a Pie + Penalización de Búsqueda
    </text>

    <!-- Reglas de desempate -->
    <rect x="14" y="62" width="612" height="38" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="24" y="78" font-size="11" font-weight="700" fill="#1769C2">Criterio 1: Menor puntuación total</text>
    <text x="24" y="92" font-size="11" fill="#475569">➔ Desempate 2: Menor % de ocupación previsto (ej. Puerta Real 74% vence a Ganivet 79%) ➔ Desempate 3: Menor caminata</text>
  </g>

  <!-- Flecha 4 -> 5 -->
  <path d="M 500 510 L 500 540" class="arrow"/>

  <!-- 5. RESULTADO FINAL (APP) -->
  <g transform="translate(40, 545)" filter="url(#shadow)">
    <rect width="920" height="110" rx="12" fill="#FFFFFF" stroke="#DFE5EB"/>
    <rect width="920" height="30" rx="12" fill="#202C3A"/>
    <rect y="16" width="920" height="14" fill="#202C3A"/>
    <text x="16" y="20" font-size="12" font-weight="700" fill="#FFFFFF">5. DECISIÓN PRESENTADA EN LA APP (INTERFAZ NAVEGABLE)</text>

    <!-- Recomendado -->
    <g transform="translate(16, 40)">
      <rect width="435" height="58" rx="8" fill="#EFF5FF" stroke="#1769C2" stroke-width="1.5"/>
      <rect x="10" y="8" width="105" height="20" rx="4" fill="#1769C2"/>
      <text x="17" y="22" class="badge-text">👑 RECOMENDADA</text>
      <text x="125" y="23" font-size="13" font-weight="800" fill="#202C3A">Garaje Rex (19 min totales)</text>
      <text x="12" y="45" font-size="11" fill="#475569">11 min coche (ETSIIT) + 8 min pie (Ayto) + 0 min penalización</text>
      <text x="330" y="45" font-size="11" font-weight="700" fill="#14532D">52% previsto · 47 libres</text>
    </g>

    <!-- Alternativa -->
    <g transform="translate(468, 40)">
      <rect width="435" height="58" rx="8" fill="#FFFFFF" stroke="#DFE5EB"/>
      <rect x="10" y="8" width="95" height="20" rx="4" fill="#D97706"/>
      <text x="17" y="22" class="badge-text">🥈 ALTERNATIVA</text>
      <text x="115" y="23" font-size="13" font-weight="800" fill="#202C3A">Puerta Real (20 min totales)</text>
      <text x="12" y="45" font-size="11" fill="#475569">12 min coche (ETSIIT) + 3 min pie (Ayto) + 5 min penalización</text>
      <text x="330" y="45" font-size="11" font-weight="700" fill="#93500D">74% previsto · 76 libres</text>
    </g>
  </g>
</svg>
